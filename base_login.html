<!DOCTYPE html><html lang="es" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro - Sistema Mantenimiento CISA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #f8fafc;
    }
    /* Ocultar flechas numéricas de input type=number */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    .pin-digit-box {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pin-digit-box.filled {
      border-color: #0d9488;
      background-color: #f0fdfa;
      color: #0f766e;
    }
    .numpad-btn {
      transition: all 0.15s ease-out;
    }
    .numpad-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body class="min-h-screen bg-[#f8fafc] text-slate-800 flex flex-col justify-between selection:bg-teal-100 selection:text-teal-900">

  <!-- Header Superior idéntico a las pantallas existentes -->
  

  <!-- Contenedor Principal Centrado -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-[440px] bg-white rounded-2xl border border-slate-200/90 shadow-[0_10px_30px_-5px_rgba(0,0,0,0.05),0_4px_6px_-2px_rgba(0,0,0,0.02)] p-7 sm:p-9 relative overflow-hidden">
      
      <!-- Detalle sutil superior turquesa -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-teal-400 via-[#0d9488] to-emerald-500"></div>

      <!-- Encabezado del Formulario -->
      <div class="text-center mb-8 pt-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#f0fdfa] border border-[#ccfbf1] text-[#0d9488] mb-4 shadow-sm">
          <span class="material-symbols-outlined text-[30px]">pin</span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 mb-1.5">Ingresar PIN de Acceso</h1>
        <p class="text-sm text-slate-500 leading-relaxed max-w-xs mx-auto">
          Introduce tu código numérico de operador o supervisor para desbloquear la consola de mantenimiento.
        </p>
      </div>

      <!-- Formulario de Acceso con un solo INPUT numérico -->
      <form id="pin-login-form" onsubmit="event.preventDefault(); handleLogin();" class="space-y-6">
        
        <!-- Campo PIN Unificado (Un solo Input que acepta números) -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label for="pin-input" class="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center gap-1.5">
              <span class="">PIN de Seguridad</span>
              <span class="text-teal-600 text-[10px] bg-teal-50 px-2 py-0.5 rounded border border-teal-100 font-semibold">Sólo números</span>
            </label>
            <button type="button" onclick="toggleVisibility()" class="text-xs text-[#0d9488] hover:text-[#0f766e] font-medium flex items-center gap-1">
              <span class="material-symbols-outlined text-[15px]" id="vis-icon">visibility</span>
              <span id="vis-text" class="">Mostrar</span>
            </button>
          </div>

          <!-- Input numérico individual con diseño limpio de alta visibilidad -->
          <div class="relative">
            <input id="pin-input" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••" autocomplete="one-time-code" class="w-full h-14 text-center text-2xl tracking-[0.4em] font-bold text-slate-800 bg-slate-50/70 border-2 border-slate-200 rounded-xl focus:bg-white focus:border-[#0d9488] focus:ring-4 focus:ring-[#0d9488]/10 outline-none transition-all placeholder:text-slate-300" required="" autofocus="">
            <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400">
              <span class="material-symbols-outlined text-[20px]">dialpad</span>
            </div>
          </div>

          <!-- Indicadores visuales de dígitos discretos -->
          <div class="flex justify-center items-center gap-2.5 pt-1" id="dots-container">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-200" id="dot-1"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-200" id="dot-2"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-200" id="dot-3"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-200" id="dot-4"></span>
          </div>
        </div>

        <!-- Teclado Numérico en Pantalla (Diseño Limpio) -->
        <div class="bg-slate-50/70 border border-slate-200/80 rounded-xl p-3 grid grid-cols-3 gap-2">
          <button type="button" onclick="appendPin('1')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">1</button>
          <button type="button" onclick="appendPin('2')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">2</button>
          <button type="button" onclick="appendPin('3')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">3</button>
          <button type="button" onclick="appendPin('4')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">4</button>
          <button type="button" onclick="appendPin('5')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">5</button>
          <button type="button" onclick="appendPin('6')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">6</button>
          <button type="button" onclick="appendPin('7')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">7</button>
          <button type="button" onclick="appendPin('8')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">8</button>
          <button type="button" onclick="appendPin('9')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">9</button>
          <button type="button" onclick="clearPin()" class="numpad-btn h-11 bg-slate-100 hover:bg-slate-200 text-slate-500 font-medium text-xs rounded-lg border border-slate-200/80 flex items-center justify-center uppercase tracking-wider">C</button>
          <button type="button" onclick="appendPin('0')" class="numpad-btn h-11 bg-white hover:bg-slate-100/90 text-slate-700 font-semibold text-lg rounded-lg border border-slate-200/70 shadow-sm flex items-center justify-center">0</button>
          <button type="button" onclick="backspacePin()" class="numpad-btn h-11 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg border border-slate-200/80 flex items-center justify-center" aria-label="Borrar">
            <span class="material-symbols-outlined text-[19px]">backspace</span>
          </button>
        </div>

        <!-- Botón Primario: INGRESAR -->
        <button id="btn-submit" type="submit" class="w-full h-12 bg-[#0d9488] hover:bg-[#0f766e] active:bg-[#115e59] text-white font-bold text-sm tracking-wider uppercase rounded-xl shadow-md hover:shadow-lg hover:shadow-teal-700/20 flex items-center justify-center gap-2 transition-all">
          <span class="material-symbols-outlined text-[20px]">login</span>
          <span class="">INGRESAR</span>
        </button>

        <!-- Mensaje de Feedback interactivo (oculto por defecto) -->
        <div id="login-feedback" class="hidden text-center text-xs py-2 px-3 rounded-lg font-medium transition-all"></div>

        <!-- Asistencia / Olvido de PIN -->
        <div class="text-center pt-2">
          <a href="#" class="text-xs font-medium text-slate-400 hover:text-[#0d9488] transition-colors inline-flex items-center gap-1">
            
            
          </a>
        </div>
      </form>
    </div>
  </main>

  <!-- Pie de página minimalista institucional -->
  <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-200/60 bg-white/50">
    <span class="">Sistema Mantenimiento CISA © 2026 • Terminal de Taller &amp; Flota Lynx</span>
  </footer>

  <!-- Lógica de interacción para teclado y dígitos numéricos -->
  <script>
    const pinInput = document.getElementById('pin-input');
    const dots = [
      document.getElementById('dot-1'),
      document.getElementById('dot-2'),
      document.getElementById('dot-3'),
      document.getElementById('dot-4')
    ];
    const feedback = document.getElementById('login-feedback');
    let isVisible = false;

    function updateDots() {
      // Filtrar sólo números estrictamente
      pinInput.value = pinInput.value.replace(/[^0-9]/g, '');
      const len = pinInput.value.length;
      
      dots.forEach((dot, index) => {
        if (index < len) {
          dot.classList.remove('bg-slate-200');
          dot.classList.add('bg-[#0d9488]', 'scale-125');
        } else {
          dot.classList.add('bg-slate-200');
          dot.classList.remove('bg-[#0d9488]', 'scale-125');
        }
      });
    }

    pinInput.addEventListener('input', updateDots);

    function appendPin(num) {
      if (pinInput.value.length < 6) {
        pinInput.value += num;
        updateDots();
      }
    }

    function clearPin() {
      pinInput.value = '';
      updateDots();
    }

    function backspacePin() {
      pinInput.value = pinInput.value.slice(0, -1);
      updateDots();
    }

    function toggleVisibility() {
      isVisible = !isVisible;
      pinInput.type = isVisible ? 'text' : 'password';
      document.getElementById('vis-icon').textContent = isVisible ? 'visibility_off' : 'visibility';
      document.getElementById('vis-text').textContent = isVisible ? 'Ocultar' : 'Mostrar';
    }

    function handleLogin() {
      const pin = pinInput.value;
      if (!pin || pin.length < 4) {
        feedback.className = 'text-center text-xs py-2.5 px-3 rounded-lg font-medium bg-amber-50 text-amber-700 border border-amber-200 block';
        feedback.textContent = 'El PIN debe contener al menos 4 dígitos numéricos.';
        pinInput.focus();
        return;
      }

      feedback.className = 'text-center text-xs py-2.5 px-3 rounded-lg font-medium bg-teal-50 text-[#0d9488] border border-teal-200 block';
      feedback.textContent = 'Verificando credenciales de acceso...';
      
      setTimeout(() => {
        feedback.className = 'text-center text-xs py-2.5 px-3 rounded-lg font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 block';
        feedback.textContent = '¡PIN Verificado! Redirigiendo a Vehículos...';
      }, 700);
    }
  </script>




</body></html>

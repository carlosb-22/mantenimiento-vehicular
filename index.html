<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de vehículos</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1f2933; --muted: #66788a;
    --line: #d9e2ec; --accent: #0b6bcb; --warn: #b45309; --ok: #0f7b3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  header { background: #102a43; color: #fff; padding: 18px 22px; }
  header h1 { margin: 0 0 6px; font-size: 1.35rem; }
  header .meta { font-size: .82rem; color: #bcccdc; word-break: break-all; }
  header .meta code {
    background: rgba(255,255,255,.14); padding: 1px 6px; border-radius: 4px;
    font-size: .8rem;
  }
  main { padding: 16px 22px 40px; max-width: 1400px; margin: 0 auto; }
  .controles {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .controles input[type="search"] {
    flex: 1 1 240px; max-width: 360px; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 8px; font-size: .95rem;
    font-family: inherit; background: #fff;
  }
  .controles label {
    display: flex; gap: 7px; align-items: center; font-size: .88rem;
    color: var(--muted); cursor: pointer; user-select: none;
  }
  .controles button {
    padding: 9px 15px; border: 0; border-radius: 8px; background: var(--accent);
    color: #fff; font-size: .88rem; font-family: inherit; cursor: pointer;
  }
  .controles button:hover { background: #095aa8; }
  .stats { font-size: .88rem; color: var(--muted); margin-bottom: 16px; }
  .stats b { color: var(--text); }
  .stats .ok { color: var(--ok); }
  .stats .warn { color: var(--warn); }

  #estado {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px; margin-bottom: 16px; font-size: .95rem;
  }
  #estado[hidden] { display: none; }
  #estado.error { border-color: #f0b429; background: #fffbeb; }
  #estado h2 { margin: 0 0 8px; font-size: 1rem; color: var(--warn); }
  #estado p { margin: 6px 0; }
  #estado code {
    background: #eef2f7; padding: 1px 6px; border-radius: 4px;
    font-size: .85rem; word-break: break-all;
  }
  #estado input[type="file"] { margin-top: 10px; font-size: .88rem; }

  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .foto { position: relative; aspect-ratio: 4 / 3; background: #e6ecf2; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .aviso {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 5px 9px;
    font-size: .74rem; color: #fff; background: rgba(102,120,138,.94);
  }
  .aviso.rotura { background: rgba(180,83,9,.94); }
  .cuerpo { padding: 12px 14px 14px; }
  .cuerpo p { margin: 2px 0; font-size: .88rem; display: flex; gap: 8px; }
  .cuerpo p .et { color: var(--muted); flex: 0 0 104px; }
  .cuerpo p .va { flex: 1 1 auto; word-break: break-word; }
  .cuerpo p.nombre { font-size: 1.05rem; font-weight: 700; margin: 0 0 8px; }
  .cuerpo p.principal .va { font-weight: 600; }
  details { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  summary {
    cursor: pointer; font-size: .84rem; color: var(--accent); font-weight: 600;
  }
  details p { margin: 2px 0; }
  footer {
    padding: 14px 22px 26px; font-size: .8rem; color: var(--muted);
    max-width: 1400px; margin: 0 auto;
  }
</style>
</head>
<body>
<header>
  <h1>Catálogo de vehículos</h1>
  <div class="meta">Fuente: <code id="fuente"></code></div>
  <div class="meta" id="version"></div>
</header>
<main>
  <div class="controles">
    <input type="search" id="buscar" placeholder="Buscar por nombre, placa, marca, VIN…" autocomplete="off">
    <label><input type="checkbox" id="soloFoto"> Solo con foto</label>
    <label><input type="checkbox" id="expandir"> Mostrar todos los datos</label>
    <button id="recargar" type="button">Recargar</button>
  </div>
  <div class="stats" id="stats" hidden></div>
  <div id="estado">Cargando catálogo…</div>
  <div class="grid" id="grid"></div>
</main>
<footer>
  Visor de solo lectura. Los datos se obtienen en vivo desde Cloudflare R2.
</footer>

<script>
/* ---------------------------------------------------------------------------
   Visor del catálogo de vehículos
   - Descarga el JSON desde Cloudflare R2 mediante fetch()
   - Renderiza una tarjeta por vehículo: <img> con "foto" + <p> con el resto
   - Si no hay foto (o falla la carga) muestra imagen y mensaje por defecto
   --------------------------------------------------------------------------- */

const URL_CATALOGO = "https://pub-2cfd7537f6a24512a06e125f7dc77a43.r2.dev/catalogo/vehiculos_empresa.json";
const BASE_FOTOS = "https://pub-2cfd7537f6a24512a06e125f7dc77a43.r2.dev/vehiculos/";

/* Campos que se muestran siempre arriba y en este orden */
const CAMPOS_PRINCIPALES = ["id", "nombre", "placa", "marca"];

/* Orden del resto de campos del vehículo */
const ORDEN_CAMPOS = [
  "asignado", "revision", "propietario", "modelo", "anio", "color", "tipo",
  "modeloMotor", "codigoMotor", "vin", "transmision", "combustible",
  "capacidadTanqueGal", "cilindrada", "cilindraje", "aceite",
  "sistemaDireccion", "potencia", "potenciaHp", "turbo", "voltaje", "bateria",
  "cca", "fusible", "voltajeAlternador", "motorArranque", "activo"
];

/* Etiquetas legibles (si una clave no está aquí se genera automáticamente) */
const ETIQUETAS = {
  id: "ID", nombre: "Nombre", placa: "Placa", marca: "Marca",
  asignado: "Asignado a", revision: "Revisión", propietario: "Propietario",
  modelo: "Modelo", anio: "Año", color: "Color", tipo: "Tipo",
  modeloMotor: "Modelo de motor", codigoMotor: "Código de motor", vin: "VIN",
  transmision: "Transmisión", combustible: "Combustible",
  capacidadTanqueGal: "Tanque (gal)", cilindrada: "Cilindrada",
  cilindraje: "Cilindraje (cc)", aceite: "Aceite",
  sistemaDireccion: "Dirección", potencia: "Potencia",
  potenciaHp: "Potencia (HP)", turbo: "Turbo", voltaje: "Voltaje (V)",
  bateria: "Batería", cca: "CCA", fusible: "Fusible",
  voltajeAlternador: "Voltaje alternador", motorArranque: "Motor de arranque",
  activo: "Activo", foto: "Foto"
};

/* Imagen por defecto (SVG en línea) usada cuando no hay foto o no carga */
const IMAGEN_POR_DEFECTO = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">' +
  '<rect width="640" height="480" fill="#e6ecf2"/>' +
  '<g fill="none" stroke="#9fb3c8" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">' +
  '<rect x="140" y="204" width="360" height="96" rx="18"/>' +
  '<path d="M204 204l44-58h128l44 58"/>' +
  '<circle cx="216" cy="304" r="26"/><circle cx="424" cy="304" r="26"/>' +
  '</g>' +
  '<text x="320" y="404" text-anchor="middle" font-family="system-ui,sans-serif" ' +
  'font-size="34" fill="#829ab1">Sin foto</text></svg>'
);

/* ------------------------- Funciones puras (testeables) ------------------------- */

/* Devuelve una URL utilizable o null. Acepta URL absoluta o sólo el nombre
   del archivo ("65.jpg" -> BASE_FOTOS + "65.jpg"). */
function resolverFoto(valor) {
  if (valor === null || valor === undefined) return null;
  const texto = String(valor).trim();
  if (!texto) return null;
  if (/^https?:\/\//i.test(texto)) return texto;
  return BASE_FOTOS + texto.replace(/^\/+/, "").split("/")
    .map((parte) => encodeURIComponent(parte)).join("/");
}

/* Texto legible para cualquier valor del JSON */
function formatearValor(valor) {
  if (valor === null || valor === undefined) return "—";
  if (typeof valor === "boolean") return valor ? "Sí" : "No";
  if (typeof valor === "number") return Number.isFinite(valor) ? String(valor) : "—";
  if (typeof valor === "object") return JSON.stringify(valor);
  const texto = String(valor).trim();
  return texto === "" ? "—" : texto;
}

/* Etiqueta legible: usa ETIQUETAS o convierte camelCase en texto separado */
function etiquetaDe(clave) {
  if (ETIQUETAS[clave]) return ETIQUETAS[clave];
  return String(clave)
    .replace(/[_-]+/g, " ")
    .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
    .replace(/^./, (c) => c.toUpperCase());
}

/* Extrae la lista de vehículos sin importar si el JSON viene como lista o
   envuelto en un objeto ({"vehiculos": [...]}) con metadatos. */
function extraerVehiculos(datos, salida) {
  const lista = salida || [];
  if (Array.isArray(datos)) {
    datos.forEach((elemento) => extraerVehiculos(elemento, lista));
    return lista;
  }
  if (datos && typeof datos === "object") {
    if ("id" in datos || "nombre" in datos || "placa" in datos) {
      lista.push(datos);
      return lista;
    }
    Object.keys(datos).forEach((clave) => {
      const valor = datos[clave];
      if (valor && typeof valor === "object") extraerVehiculos(valor, lista);
    });
  }
  return lista;
}

/* Campos secundarios (todos menos foto y los principales) ya formateados */
function camposSecundarios(vehiculo) {
  const claves = [];
  ORDEN_CAMPOS.forEach((clave) => {
    if (clave in vehiculo && !CAMPOS_PRINCIPALES.includes(clave)) claves.push(clave);
  });
  Object.keys(vehiculo).forEach((clave) => {
    if (clave === "foto" || CAMPOS_PRINCIPALES.includes(clave)) return;
    if (!claves.includes(clave)) claves.push(clave);
  });
  return claves.map((clave) => [etiquetaDe(clave), formatearValor(vehiculo[clave])]);
}

/* Búsqueda de texto libre sobre todos los valores del vehículo */
function coincide(vehiculo, busqueda) {
  const texto = busqueda.trim().toLowerCase();
  if (!texto) return true;
  return Object.keys(vehiculo)
    .map((clave) => formatearValor(vehiculo[clave]))
    .join(" ").toLowerCase().includes(texto);
}

/* ------------------------------ Render (DOM) ------------------------------ */

const $ = (id) => document.getElementById(id);

/* Crea un <p> con la etiqueta y el valor del campo */
function parrafo(etiqueta, valor, clase) {
  const p = document.createElement("p");
  if (clase) p.className = clase;
  const et = document.createElement("span");
  et.className = "et";
  et.textContent = etiqueta;
  const va = document.createElement("span");
  va.className = "va";
  va.textContent = valor;
  p.append(et, va);
  return p;
}

/* Tarjeta de un vehículo: <img> con la foto + <p> con los campos */
function crearTarjeta(vehiculo, expandir) {
  const urlFoto = resolverFoto(vehiculo.foto);

  const card = document.createElement("article");
  card.className = "card";

  const figura = document.createElement("div");
  figura.className = "foto";
  const img = document.createElement("img");
  img.alt = "Foto de " + (vehiculo.nombre || "vehículo " + vehiculo.id);
  img.loading = "lazy";
  img.decoding = "async";
  const aviso = document.createElement("div");
  aviso.className = "aviso";
  aviso.hidden = true;

  if (urlFoto) {
    // La foto existe en el JSON: si el navegador no puede cargarla, se
    // sustituye por la imagen por defecto y se avisa en el pie.
    img.addEventListener("error", () => {
      img.src = IMAGEN_POR_DEFECTO;
      aviso.className = "aviso rotura";
      aviso.textContent = "Foto no disponible (no se pudo cargar " + urlFoto + ")";
      aviso.hidden = false;
    });
    img.src = urlFoto;
    img.title = urlFoto;
  } else {
    img.src = IMAGEN_POR_DEFECTO;
    aviso.textContent = "Sin foto en el catálogo";
    aviso.hidden = false;
  }
  figura.append(img, aviso);

  const cuerpo = document.createElement("div");
  cuerpo.className = "cuerpo";
  cuerpo.append(parrafo("Nombre", formatearValor(vehiculo.nombre), "nombre"));
  cuerpo.append(
    parrafo("ID", formatearValor(vehiculo.id), "principal"),
    parrafo("Placa", formatearValor(vehiculo.placa), "principal"),
    parrafo("Marca", formatearValor(vehiculo.marca), "principal")
  );

  const secundarios = camposSecundarios(vehiculo);
  if (secundarios.length) {
    const detalles = document.createElement("details");
    detalles.open = Boolean(expandir);
    const summary = document.createElement("summary");
    summary.textContent = "Más datos (" + secundarios.length + ")";
    detalles.append(summary);
    secundarios.forEach(([etiqueta, valor]) => detalles.append(parrafo(etiqueta, valor)));
    cuerpo.append(detalles);
  }
  if (urlFoto) cuerpo.append(parrafo("Foto", urlFoto));

  card.append(figura, cuerpo);
  return card;
}

function mostrarEstado(html, esError) {
  const estado = $("estado");
  estado.hidden = false;
  estado.className = esError ? "estado error" : "estado";
  estado.innerHTML = "";
  if (esError) {
    const h2 = document.createElement("h2");
    h2.textContent = "No se pudo cargar el catálogo";
    estado.append(h2);
  }
  const p = document.createElement("div");
  p.innerHTML = html;
  estado.append(p);
  return estado;
}

/* Estado global del visor */
const visor = { vehiculos: [], metadatos: null };

function render() {
  const buscar = $("buscar").value;
  const soloFoto = $("soloFoto").checked;
  const expandir = $("expandir").checked;

  const visibles = visor.vehiculos.filter((v) => {
    if (soloFoto && !resolverFoto(v.foto)) return false;
    return coincide(v, buscar);
  });

  const grid = $("grid");
  grid.innerHTML = "";
  visibles.forEach((v) => grid.append(crearTarjeta(v, expandir)));

  const conFoto = visor.vehiculos.filter((v) => resolverFoto(v.foto)).length;
  const stats = $("stats");
  stats.hidden = false;
  stats.innerHTML =
    "Mostrando <b>" + visibles.length + "</b> de <b>" + visor.vehiculos.length + "</b> vehículos" +
    " · <span class='ok'>Con foto: " + conFoto + "</span>" +
    " · <span class='warn'>Sin foto: " + (visor.vehiculos.length - conFoto) + "</span>";

  if (!visor.vehiculos.length) {
    mostrarEstado("El catálogo se descargó correctamente pero no contiene vehículos.", false);
  } else if (!visibles.length) {
    mostrarEstado("Ningún vehículo coincide con el filtro actual.", false);
  } else {
    $("estado").hidden = true;
  }
}

/* -------------------------------- Arranque -------------------------------- */

function pintarMetadatos(datos, origen) {
  $("fuente").textContent = origen;
  const partes = [];
  if (datos && datos.version) partes.push("versión " + datos.version);
  if (datos && datos.ultimaActualizacion) {
    partes.push("última actualización " + datos.ultimaActualizacion);
  }
  $("version").textContent = partes.join(" · ");
}

/* Carga el catálogo desde R2 con fetch() */
async function cargarDesdeR2() {
  mostrarEstado("Cargando catálogo desde Cloudflare R2…", false);
  $("stats").hidden = true;
  $("grid").innerHTML = "";
  try {
    const respuesta = await fetch(URL_CATALOGO, { cache: "no-store" });
    if (!respuesta.ok) throw new Error("HTTP " + respuesta.status + " " + respuesta.statusText);
    const datos = await respuesta.json();
    visor.vehiculos = extraerVehiculos(datos);
    visor.metadatos = datos;
    pintarMetadatos(datos, URL_CATALOGO);
    render();
  } catch (error) {
    mostrarEstado(
      "<p>No se pudieron obtener los datos desde <code>" + URL_CATALOGO + "</code>.</p>" +
      "<p>Detalle: <code>" + String(error && error.message ? error.message : error) + "</code></p>" +
      "<p>Comprueba tu conexión. Si abriste el archivo con <code>file://</code>, sírvelo por HTTP " +
      "(por ejemplo <code>python -m http.server</code>) y vuelve a intentar.</p>" +
      "<p>También puedes cargar el JSON guardado en tu equipo:</p>",
      true
    );
    const entrada = document.createElement("input");
    entrada.type = "file";
    entrada.accept = ".json,application/json";
    entrada.addEventListener("change", cargarArchivoLocal);
    $("estado").append(entrada);
  }
}

/* Alternativa sin red: leer un JSON local elegido por el usuario */
function cargarArchivoLocal(evento) {
  const archivo = evento.target.files && evento.target.files[0];
  if (!archivo) return;
  const lector = new FileReader();
  lector.onload = () => {
    try {
      const datos = JSON.parse(lector.result);
      visor.vehiculos = extraerVehiculos(datos);
      visor.metadatos = datos;
      pintarMetadatos(datos, "archivo local: " + archivo.name);
      render();
    } catch (error) {
      mostrarEstado("El archivo no es un JSON válido: <code>" + error.message + "</code>", true);
    }
  };
  lector.readAsText(archivo, "utf-8");
}

function iniciar() {
  $("buscar").addEventListener("input", render);
  $("soloFoto").addEventListener("change", render);
  $("expandir").addEventListener("change", render);
  $("recargar").addEventListener("click", cargarDesdeR2);
  cargarDesdeR2();
}

if (typeof document !== "undefined" && document.getElementById) iniciar();
</script>
</body>
</html>
